[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qnnrev"
version = "0.2.0"
description = "Toolkit for inspecting, unpacking, and reconstructing Qualcomm QNN / QAIRT Hexagon HTP context binaries"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [
  { name = "Chromatic", email = "feedback@chromatic.hu" },
]
keywords = [
  "qnn",
  "qairt",
  "hexagon",
  "htp",
  "onnx",
  "quantization",
  "reverse-engineering",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Disassemblers",
]
dependencies = [
  "numpy>=1.24",
  "onnx>=1.15",
]

[project.optional-dependencies]
runtime = [
  "onnxruntime>=1.17",
]
dev = [
  "pytest>=8.0",
  "onnxruntime>=1.17",
]

[project.scripts]
qnnrev = "qnnrev.__main__:main"

[project.urls]
Homepage = "https://github.com/Has-X/QNNRev"
Repository = "https://github.com/Has-X/QNNRev"
Issues = "https://github.com/Has-X/QNNRev/issues"

[tool.setuptools.packages.find]
include = ["qnnrev*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
