name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Bytecode compile check
        run: python -m compileall -q qnnrev tests

      - name: Run test suite
        run: pytest -v

      - name: Build libhtp_deser_tap.so
        run: make -C native libhtp_deser_tap.so

      - name: Check CLI help
        run: qnnrev --help
